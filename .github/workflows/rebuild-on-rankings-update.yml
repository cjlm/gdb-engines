name: Rebuild site

# Rebuild monthly when rankings change and daily so cached GitHub star counts stay fresh.
# Both paths call the same Cloudflare Pages deploy hook.

on:
  repository_dispatch:
    types: [rankings-updated]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::CF_PAGES_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Cloudflare Pages deploy triggered."
