name: Verify evidence

# Refetches every cited page and confirms the stored quotes are still on it. Sources move and get
# rewritten; without this the site keeps citing pages that no longer say what we claim they say.
#
# Runs weekly, and on any change to the evidence or the tooling around it. The working tree is left
# dirty on purpose — the run reports, it does not commit refreshed verdicts.

on:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - 'src/content/evidence/**'
      - 'src/content/databases/**'
      - 'scripts/verify-quotes.mjs'
      - 'scripts/check-evidence.mjs'
      - 'scripts/lib/evidence-file.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Refetch cited pages
        run: node scripts/verify-quotes.mjs

      - name: Check values against their evidence
        run: node scripts/check-evidence.mjs
