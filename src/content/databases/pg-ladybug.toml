name = "pg_ladybug"
vendor = "LadybugDB"
slug = "pg-ladybug"
description = "A PostgreSQL extension that embeds the LadybugDB engine to run Cypher queries from SQL. Registered Postgres tables act as node and relationship labels, and Ladybug's planner rewrites each pattern into a single SQL join executed natively by Postgres; Cypher can also run against Ladybug-native tables stored in the data directory."
url = "https://github.com/LadybugDB/pg_ladybug"
