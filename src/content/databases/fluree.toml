description = "A temporal RDF graph database written in Rust. Each transaction is an immutable, content-addressed commit, so data can be queried as of any point in history, with git-style branching, triple-level access policies, and built-in full-text, vector, and geospatial search."
ai_roles = ["agent-memory", "graphrag"]
url = "https://flur.ee/"
github_url = "https://github.com/fluree/db"
license = "BUSL-1.1"
