name = "oxilite"
vendor = "Volodymyr Pavlyshyn"
slug = "oxilite"
description = "An Oxigraph-compatible RDF database and SPARQL engine that stores quads in plain SQLite, running in-process via rusqlite, against a system libsqlite3, or on Cloudflare D1. Compiles each SPARQL query into a single SQL statement and mirrors Oxigraph's Rust API, with RDFS/OWL reasoning, SHACL validation, and openCypher queries over the same data."
url = "https://oxilitedb.com"
github_url = "https://github.com/Volland/oxilite"
license = "MIT OR Apache-2.0"
implementation_language = "Rust"
type = "RDF"
query_languages = ["SPARQL", "openCypher"]
protocols = ["SPARQL Protocol"]
kind = "embedded"
released = "2026-09"
category = "Emerging"
gdotv_support = false

[lineage.oxigraph]
relation = "borrows-from"
