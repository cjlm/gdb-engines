description = "A PostgreSQL extension that exposes graph algorithms as plain SQL functions. Each function takes arrays of source and target node ids and returns a table, covering PageRank, betweenness, closeness and eigenvector centrality, strongly and weakly connected components, Louvain community detection, Dijkstra, topological sort and cycle detection."
