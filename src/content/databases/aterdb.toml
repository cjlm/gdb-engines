slug = "aterdb"
description = "A proprietary database built on a modified PostgreSQL engine that runs Cypher graph queries natively over relational storage, from SQL through a g4pg.run() function or over the Bolt protocol. Graph queries can use full-text and vector indexes, and the engine replaces PostgreSQL's process-per-connection model with asynchronous dispatch. Announced in November 2026 with a hosted demo and no public download."
