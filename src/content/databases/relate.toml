name = "Relate"
vendor = "Neo4j Inc"
slug = "relate"
description = "An embedded, in-memory property graph database written in Rust by Neo4j for AI agent memory and sandboxes, released as an experimental Neo4j Labs project. Keeps a graph in memory, in a directory or in a single file, made durable by a write-ahead log and Parquet checkpoints. Speaks Cypher 25 with vector and full-text search in the same query, and can optionally serve Bolt, HTTP and MCP."
