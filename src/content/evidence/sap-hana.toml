[[claims]]
field = "protocols"
value = ["Native binary", "JDBC/ODBC"]
confidence = "high"
method = "vendor-docs"
checked = "2026-08-01"
notes = "SQL/graph access (openCypher, GraphScript) runs over HANA's proprietary, documented SQL Command Network Protocol; JDBC and ODBC are vendor-shipped standard connectors, while the Python DB API, Node.js, Ruby and Go drivers speak the binary protocol directly rather than through JDBC/ODBC. Rejected HTTP/REST (pass_B): OData/XMLA are optional web interfaces the application developer must build, not a built-in query channel."

  [[claims.sources]]
  url = "https://help.sap.com/doc/63cef00e229b4010be06cfa01e1d338b/2.0.00/en-US/SAP_HANA_SQL_Command_Network_Protocol_Reference_en.pdf"
  title = "SAP HANA SQL Command Network Protocol Reference"
  quote = "This document describes the SQL Command Network Protocol of the SAP HANA database, the protocol used by SAP HANA database clients to communicate with the SAP HANA database."
  verified = "matched"
  checked = "2026-08-02"

