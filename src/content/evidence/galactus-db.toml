[[claims]]
field = "features.query_distribution"
value = 1
confidence = "high"
method = "vendor-docs"
checked = "2026-11-20"
notes = "Vendor self-assessed. In Nebula Cluster every server takes any request over plain Bolt and the cluster assigns it to the right server: a write that reaches a server which does not lead is carried to the leader, and a read is answered by the server it reached once that server has caught up with the cluster. No routing driver is involved. On a database with property shards, the server that runs the statement reads the properties it needs from the shards that hold them and returns one result. A statement is not split to run in parallel on several servers. Nebula Cluster is in early access from 19 November 2026, by arrangement with the vendor, and is not in the public image; in the released single-server product queries run on the one server and replicas are addressed by name, which would score 0."

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "Point your application at any server, or at all of them behind a load balancer."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "A write that reaches a server which does not lead is carried to the leader and answered on the same connection."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/connect"
  title = "Connect applications | Galactus DB"
  quote = "A read sees every write acknowledged before it, on whichever server it runs."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/property-shards"
  title = "Property shards | Galactus DB"
  quote = "A statement that reads a property of many rows asks for them a few hundred rows at a time."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
