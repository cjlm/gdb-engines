[[claims]]
field = "features.high_availability"
value = 1
confidence = "high"
method = "vendor-docs"
checked = "2026-11-20"
notes = "Vendor self-assessed. Two mechanisms. In the released product a replica can be kept on another server as a standby and promoted to writable with PROMOTE, which is a manual step. Nebula Cluster adds automatic failover: three or more servers hold the database and choose a new leader between themselves when one is lost. Nebula Cluster is in early access from 19 November 2026, by arrangement with the vendor, and is not in the public image."

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "When one is lost, another takes over within seconds and every acknowledged write is still there."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "In a cluster the servers settle it between themselves: a write was accepted 2.6 seconds after we killed the leader."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "Nebula Cluster is in early access."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/operations/replicas"
  title = "Replica databases | Galactus DB"
  quote = "Use it to serve reads and reports, as a standby"
  verified = "matched"
  checked = "2026-11-17"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/operations/replicas"
  title = "Replica databases | Galactus DB"
