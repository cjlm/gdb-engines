[[claims]]
field = "features.cluster_rebalancing"
value = 1
confidence = "high"
method = "vendor-docs"
checked = "2026-11-20"
notes = "Vendor self-assessed. In Nebula Cluster the cluster moves copies of databases between servers by itself while they serve: a server that is added and enabled is given copies until the servers are even, a server that is drained is emptied, and a lost server's copies are made again on other servers after a grace period. When a sharded database is given more shards, its properties are evened out over them. Nebula Cluster is in early access from 19 November 2026, by arrangement with the vendor, and is not in the public image; the released single-server product has no cluster to rebalance and would score 0."

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "Add a server and enable it, and copies move onto it until the servers are even."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/servers"
  title = "Servers | Galactus DB"
  quote = "When one server holds at least two more copies than another, a copy is moved."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/property-shards"
  title = "Property shards | Galactus DB"
  quote = "The database's properties are then evened out over all of them, a part at a time, while it is read and written."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/nebula"
  title = "Nebula Cluster: a graph database that stays up | Galactus DB"
  quote = "Nebula Cluster is in early access."
  verified = "matched"
  checked = "2026-11-20"

[[claims]]
field = "features.data_distribution"
value = 1
confidence = "high"
method = "vendor-docs"
checked = "2026-11-20"
notes = "Vendor self-assessed. Nebula Cluster shards a database's property values across groups of servers (property shards), so that a database can be larger than one server's disk. Only the property values are sharded: the graph's structure and its indexes stay together on one group of servers, each of which holds a full copy of them. Property shards are a preview in Nebula 3.0.0-alpha.1, turned on by a setting. Nebula Cluster is in early access from 19 November 2026, by arrangement with the vendor, and is not in the public image. A rubric that requires the structure to be sharded too, or a generally released feature, would score 0."

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/property-shards"
  title = "Property shards | Galactus DB"
  quote = "Property shards spread them over groups of servers, so that a database can be larger than one server's disk while its structure and every index stay together."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/property-shards"
  title = "Property shards | Galactus DB"
  quote = "Each property shard is a group of servers with its own leader, placed, repaired and moved by the cluster like a database."
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
  url = "https://galactusdb.com/docs/nebula/property-shards"
  title = "Property shards | Galactus DB"
  quote = "Property shards are a preview in Nebula 3.0.0-alpha.1"
  verified = "matched"
  checked = "2026-11-20"

  [[claims.sources]]
