notes = "Python client talks to the coordinator over gRPC for the analytical/learning engines. The Interactive (GIE/Flex) engine additionally exposes an HTTP/REST admin+query API (see graphscope.io/docs/flex/interactive/development/restful_api), a Bolt endpoint for Cypher via standard neo4j drivers, and a Gremlin WebSocket endpoint (ws://.../gremlin) for the GIE Gremlin frontend. Draft only listed gRPC and HTTP/REST."

