notes = "Rya's web.rya WAR exposes ad-hoc /loadrdf and /queryrdf endpoints (plus a sparqlQuery.jsp form) that run SPARQL, but an open Rya ticket (RYA-477) proposes adding a standards-conformant /sparql endpoint and SPARQL Service Description, implying the current endpoint is not a conformant W3C SPARQL 1.1 Protocol implementation; dropped the draft's SPARQL Protocol tag for this reason."

