slug = "cosmos-db"

[[claims]]
field = "protocols"
value = ["Gremlin (WebSocket)", "HTTP/REST", "Native binary"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-08-01"
notes = "Gremlin API is WebSocket (confirmed by the 101-upgrade error path in the Gremlin FAQ) and the default access mode for all APIs is an HTTPS gateway (HTTP/REST); rejected pass_B's justification for Native binary (Cassandra/MongoDB wire compatibility, which explicitly reuse standard, non-proprietary protocols the vocabulary has no tag for) but added Native binary anyway for a different, undisputed reason neither pass raised: the SQL/Core API's proprietary TCP 'direct mode', which only the .NET and Java SDKs support and which Microsoft does not publish a wire spec for; the port table shows direct mode is not offered for the Graph API."

