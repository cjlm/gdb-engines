[[claims]]
field = "protocols"
value = ["HTTP/REST", "WebSocket"]
confidence = "high"
method = "vendor-docs"
checked = "2026-08-01"
notes = "Cypher and admin operations go through the /api/v2/ JSON REST API; a separate WebSocket standing-query wiretap (ws://{host}/api/v2/graph/{graph}/standingQueries/{name}:tap) streams live results but is explicitly marked experimental/unstable; accepted pass_A's WebSocket tag since the wiretap is a real, documented client-facing channel, not just an internal detail."

