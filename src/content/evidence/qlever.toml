notes = "QLever implements SPARQL 1.1 Protocol plus the Graph Store HTTP Protocol; it also exposes a separate, documented non-SPARQL admin HTTP API on the same host:port (e.g. cmd=rebuild-index, cmd=... commands, distinct from query=/update= SPARQL requests), which is genuine HTTP/REST beyond the SPARQL endpoint — pass_B's inclusion of HTTP/REST is correct and pass_A's SPARQL-only answer misses this admin surface."

