[[claims]]
field = "kg_capabilities"
value = ["OWL reasoning", "Vector search", "Graph algorithms"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-11-01"
notes = "OWL: query-time inference over OWL axioms (SUBCLASS OF, EQUIVALENT TO, unionOf/intersectionOf/oneOf, SYMMETRIC, TRANSITIVE, INVERSE OF, SUBPROPERTY OF, PROPERTY CHAIN); no named OWL 2 profile given. Not listed: SPARQL 1.1 (only federation to remote SPARQL endpoints via FROM SERVICE, GQLDB itself is queried with GQL); RDFS reasoning (subclass/subproperty inference exists but DOMAIN/RANGE are used for validation, not entailment); SHACL (validation uses its own ontology enforcement modes, not SHACL); no R2RML. Vector index is HNSW. Algorithms are compiled into the database."

  [[claims.sources]]
  url = "https://www.ultipa.com/docs/ontology"
  title = "GQLDB docs: Ontology Introduction"
  quote = "Subclass closure, OWL characteristics, and class / property constructors (union, intersection, oneOf, equivalence), at query time"
  supports = "OWL reasoning"
  verified = "matched"
  checked = "2026-11-01"

  [[claims.sources]]
  url = "https://www.ultipa.com/docs/ai-and-vectors/vector-index"
  title = "GQLDB docs: Vector Index"
  quote = "GQLDB's vector index is built on HNSW (Hierarchical Navigable Small World), a graph-based algorithm for approximate nearest neighbor (ANN) search."
  supports = "Vector search"
  verified = "matched"
  checked = "2026-11-01"

  [[claims.sources]]
  url = "https://www.ultipa.com/docs/graph-algorithms"
  title = "Ultipa docs: Graph Algorithms Introduction"
