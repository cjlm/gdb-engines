slug = "nodedb"

[[claims]]
field = "protocols"
value = ["PostgreSQL wire", "HTTP/REST", "WebSocket", "Redis RESP", "Native binary"]
confidence = "high"
method = "repo"
checked = "2026-08-01"
notes = "Own docs confirm five vocabulary-matching wire protocols on distinct ports: pgwire (6432), HTTP/REST + WebSocket JSON-RPC (6480, plus a second WebSocket sync channel on 9090 for NodeDB-Lite/CRDT), RESP2 (6381), and a native MessagePack protocol (6433) with a proprietary versioned handshake (magic bytes, capability bitmask) that is not a re-use of any standard protocol, so it is 'Native binary'. Rejected pass_A's omission of the native protocol, which mistakenly claimed no matching vocabulary tag exists. ILP (InfluxDB line protocol) has no controlled-vocabulary match and is correctly omitted by both passes."

