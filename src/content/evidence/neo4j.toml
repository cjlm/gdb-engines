[[claims]]
field = "kg_extension_capabilities"
value = ["RDFS reasoning", "SHACL validation"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-11-03"
notes = "Both values come from Neo4j Labs neosemantics (n10s), a plugin Neo4j publishes as a Labs project and does not bundle with the database. RDFS reasoning is partial: n10s runs query-time inference over class hierarchies (rdfs:subClassOf imported as SCO, via n10s.inference.nodesLabelled/hasLabel) and relationship hierarchies (rdfs:subPropertyOf). The docs say 'basic inferencing' and show no domain/range inference. OWL reasoning is not recorded: n10s imports OWL ontologies but documents no inference in any OWL profile. SHACL validation: the docs say 'we cover a significant portion of the SHACL language but not all'. SPARQL 1.1 is not recorded because n10s imports and exports RDF but does not answer SPARQL queries. R2RML is not recorded: n10s 'model mapping' renames vocabulary on import/export and is not R2RML or RML."

  [[claims.sources]]
  url = "https://neo4j.com/labs/neosemantics/4.3/inference/"
  title = "Neosemantics (n10s) docs: Inferencing/Reasoning"
  quote = "we can use rdfs:subPropertyOf to create hierarchies of relationships, or in other words to state that all resources connected by one relationship are also implicitly connected by any parent relationship."
  supports = "RDFS reasoning"
  verified = "matched"
  checked = "2026-11-03"

  [[claims.sources]]
  url = "https://neo4j.com/labs/neosemantics/4.3/validation/"
  title = "Neosemantics (n10s) docs: Validating Neo4j graphs against SHACL"
  quote = "Neosemantics uses the W3C standard Shapes Constraint Language (SHACL) as the formalism to describe such graph constraints."
  supports = "SHACL validation"
  verified = "matched"
  checked = "2026-11-03"
