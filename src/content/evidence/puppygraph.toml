[[claims]]
field = "protocols"
value = ["Bolt", "Gremlin (WebSocket)", "HTTP/REST"]
confidence = "high"
method = "vendor-docs"
checked = "2026-07-31"
notes = "openCypher is served over the Bolt protocol (port 7687), Gremlin over TinkerPop's WebSocket channel (port 8182), and a REST API backs the Web UI/schema metadata (port 8081); no Gremlin HTTP channel is documented, contradicting the draft."

