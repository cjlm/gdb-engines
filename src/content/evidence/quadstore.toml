[[claims]]
field = "kg_extension_capabilities"
value = ["SPARQL 1.1"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-11-03"
notes = "Quadstore itself is an RDF/JS quad store with no query engine; SPARQL is answered by quadstore-comunica, a separate package from the same quadstorejs organisation (a bundled Comunica distribution), so SPARQL 1.1 is recorded as an extension capability, not built-in. The 1.1 level rests on quadstore-comunica's build running the W3C SPARQL 1.1 Query and Update test suites rather than an explicit conformance statement, hence medium. No reasoning, SHACL, R2RML, vector index or graph algorithms."

  [[claims.sources]]
