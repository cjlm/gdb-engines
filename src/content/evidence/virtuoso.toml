value = ["SPARQL 1.1", "RDFS reasoning", "SHACL validation", "R2RML mapping"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-11-03"
notes = "SHACL: built-in DB.DBA.SHACL_COMPILE_SG compiles shapes into validator procedures that write a validation report graph (how-to posted by OpenLink on its community site; SHACL arrived in a Virtuoso 8.3 maintenance release and the open-source edition's NEWS does not mention it, so it may be Enterprise-only). Query-time inference rule bases from RDFS triples (subClassOf, subPropertyOf) plus selected OWL constructs (sameAs, equivalentClass/Property, TransitiveProperty, inverseOf) - the docs say other RDFS/OWL information is not taken into account, not a full OWL profile, so OWL reasoning left out. Native HNSW vector indexes appear only in the unreleased v7.2.18 development branch NEWS (latest release v7.2.17), so Vector search left out. No graph algorithm library found."

