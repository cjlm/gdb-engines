[[claims]]
field = "protocols"
value = ["Native binary"]
confidence = "high"
method = "vendor-docs"
checked = "2026-08-01"
notes = "Both the DSE driver's execute_graph() and, in the current DSE 6.9 release, the bundled dse gremlin-console tool itself default to the Cassandra CQL native binary protocol (port 9042) rather than a separate Gremlin Server; the port-8182 TinkerPop Gremlin Server / remote.yaml WebSocket channel pass_A cited belongs to the legacy 'Classic' graph engine superseded by the CQL-native 'Core' engine, so Gremlin (WebSocket) is rejected."

