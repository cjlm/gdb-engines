notes = "RDF/SPARQL queries go through the SPARQL server implementing the W3C SPARQL Protocol (default port 1234); the official MQL/property-graph drivers (Python, JS) connect over a ws:// WebSocket URL rather than plain HTTP. Draft's generic HTTP/REST tag is corrected to WebSocket for the non-SPARQL client path."

