notes = "SNARL, Stardog's proprietary RPC-over-Protobuf wire protocol, was disabled in 4.2.4 and removed in 5.0, so pass_A's Native binary tag is stale for current versions. The Stardog HTTP Protocol extends the standard SPARQL 1.1 HTTP/Graph Store bindings with its own non-SPARQL resource endpoints, which justifies HTTP/REST alongside SPARQL Protocol (agreeing with pass_B)."

