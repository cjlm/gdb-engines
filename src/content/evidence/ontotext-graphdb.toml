[[claims]]
field = "kg_capabilities"
value = ["SPARQL 1.1", "RDFS reasoning", "OWL reasoning", "SHACL validation", "R2RML mapping", "Vector search"]
confidence = "high"
method = "vendor-docs"
checked = "2026-11-01"
notes = "OWL: predefined rulesets incl. owl-horst (pD*), owl-max, owl2-rl, owl2-ql; forward-chaining total materialization. SHACL via RDF4J ShaclSail bundled in GraphDB. R2RML via bundled Ontop (virtual repositories). Vector search (medium): the built-in similarity plugin uses a random-indexing vector space model; embedding-based vector search otherwise goes through Elasticsearch/OpenSearch connectors (external). Graph path search (shortest/all paths) exists but no algorithm library, so Graph algorithms left out."

  [[claims.sources]]
  url = "https://graphdb.ontotext.com/documentation/11.5/sparql-compliance.html"
  title = "SPARQL compliance - GraphDB 11.5 documentation"
  quote = "SPARQL 1.1 Query provides more powerful query constructions compared to SPARQL 1.0."
