[[claims]]
field = "protocols"
value = ["HTTP/REST"]
confidence = "high"
method = "repo"
checked = "2026-08-01"
notes = "Python SDK offers a JSON backend and a binary (Turing proto) backend, but both ride HTTP against the daemon on :6666 — a payload encoding, not a separate wire protocol. Embedded mode is in-process and carries no protocol tag."

  [[claims.sources]]
