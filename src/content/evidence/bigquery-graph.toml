[[claims]]
field = "kg_kinds"
value = ["property-graph"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-11-03"
notes = "Google's official codelab builds a knowledge graph (entities/relationships extracted with Gemini) and queries it as a BigQuery property graph with GQL. The earlier source (knowledge graphs in the overview's list of graph-database uses) was dropped as a use-case list item. Graphs are property graphs defined over existing BigQuery tables; Google's GA blog post (cloud.google.com/blog/products/data-analytics/bigquery-graph-connecting-data-and-ai-at-scale/) also describes a 'virtual knowledge graph' over Iceberg/other-cloud tables 'without data movement', which a reviewer may consider for 'virtual' (not assigned here)."

  [[claims.sources]]
  url = "https://codelabs.developers.google.com/gke/ai-toolkit-lab-3"
  title = "Scale Distributed Data Processing with GKE to build a Knowledge Graph in BigQuery (Google Codelabs)"
  quote = "Scale Distributed Data Processing with GKE to build a Knowledge Graph in BigQuery"
  supports = "property-graph"
  verified = "matched"
  checked = "2026-11-03"

  [[claims.sources]]
  url = "https://codelabs.developers.google.com/gke/ai-toolkit-lab-3"
  title = "Scale Distributed Data Processing with GKE to build a Knowledge Graph in BigQuery (Google Codelabs)"
  quote = "Finally, you will store this data in BigQuery and use the new BigQuery Property Graph feature to analyze the relationships."
  supports = "property-graph"
  verified = "matched"
  checked = "2026-11-03"

