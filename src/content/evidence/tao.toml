notes = "Facebook-internal and closed-source; the 2013 USENIX paper describes a custom multiplexed protocol with out-of-order responses between clients and TAO's cache tier but never names a public wire format, so the draft's specific 'Native binary (RPC)' claim goes beyond what's confirmable."

  [[claims.sources]]
  url = "https://www.usenix.org/system/files/conference/atc13/atc13-bronson.pdf"
  title = "TAO: Facebook's Distributed Data Store for the Social Graph"
  quote = "so to avoid head-of-line blocking on multiplexed connections we use a protocol with out-of-order responses."
  verified = "matched"
  checked = "2026-08-02"

