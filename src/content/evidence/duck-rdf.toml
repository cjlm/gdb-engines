notes = "SPARQL 1.1 recorded with a caveat: the makers document a subset of SPARQL 1.1 (SELECT and ASK only; CONSTRUCT/DESCRIBE, GRAPH/FROM NAMED, SERVICE, updates and some builtins are rejected), translated to SQL over DuckDB tables via an R2RML/YARRRML mapping rather than executed by a SPARQL engine, and the README calls SPARQL support 'very experimental' - hence medium. R2RML/YARRRML mappings are used for writing RDF and, in reverse, for SPARQL-to-SQL translation. Distributed as a DuckDB Community Extension. No reasoning, SHACL, vector index or graph algorithms."

