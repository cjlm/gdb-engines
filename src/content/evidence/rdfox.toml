[[claims]]
field = "kg_capabilities"
value = ["SPARQL 1.1", "RDFS reasoning", "OWL reasoning", "SHACL validation", "Vector search"]
confidence = "high"
method = "vendor-docs"
checked = "2026-11-03"
notes = "RDFS: RDFS schema triples (e.g. rdfs:subClassOf) in a named graph are parsed as OWL axioms (importaxioms) and materialised as rules, and the builtin <rdfox:TBoxReasoning> rule set partially encodes RDFS/OWL vocabulary semantics; there is no separate named RDFS entailment regime. OWL 2 axioms (OWL 2 RL-style) translated to Datalog rules for materialisation on a best-effort basis; also SWRL and its own Datalog rule language. Vector search = 'semantic index tuple tables' over embeddings from a bundled embedding model (RDFox 7.x). No R2RML (external data sources use RDFox's own tuple-table mapping). No graph algorithm library."

  [[claims.sources]]
  url = "https://docs.oxfordsemantic.tech/features-and-requirements.html"
  title = "RDFox docs: Features and Requirements"
  quote = "RDFox can answer SPARQL 1.1 queries"
  supports = "SPARQL 1.1"
  verified = "matched"
  checked = "2026-11-03"

