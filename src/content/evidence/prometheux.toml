[[claims]]
field = "kg_capabilities"
value = ["Graph algorithms"]
confidence = "high"
method = "vendor-docs"
checked = "2026-11-01"
notes = "Built-in Vadalog graph algorithms (shortest paths, connected components, degree/betweenness centrality, PageRank). Not listed: OWL reasoning (OWL ontologies are translated to Vadalog rules via Vadalingo, but no OWL profile/entailment semantics are documented; reasoning is Warded Datalog+/- rules); SPARQL (only a data source for RDF triple stores, no SPARQL endpoint found); Vector search (Vadalog AI functions compute embeddings and similarity, but no vector index documented; Qdrant is a connector). No SHACL or R2RML found."

