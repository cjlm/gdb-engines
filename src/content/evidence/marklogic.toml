slug = "marklogic"

[[claims]]
field = "protocols"
value = ["HTTP/REST", "SPARQL Protocol", "JDBC/ODBC", "PostgreSQL wire", "Native binary"]
confidence = "high"
method = "vendor-docs"
checked = "2026-08-01"
notes = "MarkLogic ships five distinct client channels, confirmed independently: the generic REST Client API (document CRUD/search); a dedicated W3C SPARQL Protocol endpoint at /v1/graphs/sparql that is separate from the general REST surface; official ODBC and JDBC drivers whose app server (port 5432) literally speaks the PostgreSQL wire protocol; and the still-current XDBC/XCC proprietary wire protocol for Java middleware (confirmed present in the current v12 admin docs, not just legacy v9). pass_A missed SPARQL Protocol and JDBC; pass_B missed PostgreSQL wire and Native binary."

