[[claims]]
field = "protocols"
value = ["JDBC/ODBC", "HTTP/REST", "SPARQL Protocol"]
confidence = "high"
method = "vendor-docs"
checked = "2026-08-01"
notes = "PGX JDBC driver and SQL/PGQ-over-JDBC cover JDBC/ODBC; the PGX Graph Server REST API and ORDS network/model-management endpoints are a genuine non-SPARQL REST API; the ORDS RDF Graph sparql/1.1 endpoints explicitly implement SPARQL 1.1 Protocol (linked to the W3C spec), so pass_A's inclusion of SPARQL Protocol is correct and pass_B's omission of it is wrong."

  [[claims.sources]]
