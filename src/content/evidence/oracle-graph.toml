[[claims]]
field = "implementation_language"
value = "Java"
confidence = "medium"
method = "vendor-docs"
checked = "2026-08-02"
notes = "Confirms the current value with a caveat: Oracle Graph is split. The RDF/property-graph storage lives inside the C-based Oracle Database kernel, but the headline graph analytics engine (PGX, Parallel Graph AnalytiX) that Oracle Graph leads with is written in Java, with a C++ distributed runtime variant."

  [[claims.sources]]
  url = "https://gianniceresa.com/2020/04/property-graph-release-20-1-0-a-new-packaging/"
  title = "Property Graph release 20.1.0: a new packaging"
  quote = "PGX was an official Database add-on, and because the database is officially released for Windows they had to release PGX for Windows as well. PGX is written in Java"
  verified = "matched"
  checked = "2026-08-02"

