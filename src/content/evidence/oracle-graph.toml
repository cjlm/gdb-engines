[[claims]]
field = "kg_capabilities"
value = ["SPARQL 1.1", "RDFS reasoning", "OWL reasoning", "R2RML mapping", "Vector search", "Graph algorithms", "SHACL validation"]
confidence = "medium"
method = "vendor-docs"
checked = "2026-11-01"
notes = "OWL: native OWL inference engine with OWLPrime (and OWL 2 RL/user rulebases) via entailments (rules indexes). SPARQL 1.1 via SEM_MATCH and Jena/RDF4J adapters (docs describe SPARQL 1.1 constructs; no single full-compliance statement found). SHACL is via the Oracle RDF Graph Adapter for Eclipse RDF4J (official Oracle-shipped adapter), not the database core. Vector search is Oracle AI Vector Search in the same database, combined with RDF graphs for GraphRAG. Graph algorithms: PGX graph server built-ins (80+) and in-database DBMS_OGA functions."

