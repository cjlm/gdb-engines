slug = "weaver"

[[claims]]
field = "protocols"
value = ["Native binary"]
confidence = "medium"
method = "repo"
checked = "2026-08-01"
notes = "Dormant since 2016 (last GitHub push 2016-11-14; weaver.systems now just redirects to a placeholder lander page), but unlike a marketing-only case, the client source itself (client/comm_wrapper.h) shows the client library holds a busybee_st handle and sends/receives raw e::buffer messages directly to servers — the same undocumented TCP messaging/binary-framing layer used by sibling project HyperDex, with no public wire-protocol spec. Agrees with pass_A's Native binary over pass_B's Unknown, since primary source code (not just a dead domain or old blog post) settles what the client actually spoke."

  [[claims.sources]]
  url = "https://github.com/rescrv/busybee"
  title = "rescrv/busybee"
  quote = "It exposes a \"messaging\" abstraction on top of TCP and automatically packs/unpacks messages on the wire."
  verified = "matched"
  checked = "2026-08-02"

