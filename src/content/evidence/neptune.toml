[[claims]]
field = "implementation_language"
value = "C++"
confidence = "medium"
method = "vendor-docs"
checked = "2026-08-02"
notes = "AWS does not directly disclose Neptune's implementation language. Amazon's own paper on Poseidon, the engine behind Neptune Analytics, describes a C++ template-heavy codebase, and Neptune engineering job postings require C++ (or Rust) proficiency for the storage/compute core, so C++ is the best-supported inference for the primary engine language."

